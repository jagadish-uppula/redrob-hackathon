# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Gemini"

ai_usage_summary: |
  Used Gemini for architecture discussion, code review, and implementation
  assistance. The ranking logic, feature engineering, and scoring weights
  are original work based on careful analysis of the JD and candidate data.
  No candidate data was fed to any LLM during ranking.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Rule-based, JD-agnostic ranking system with five scoring components:
  (1) Title alignment — primary defense against keyword-stuffer traps,
  (2) Career history analysis — keyword matching on job descriptions for
  retrieval/search/ranking/production signals, with consulting-only
  career detection, (3) Skills matching with trust validation — cross-
  references proficiency claims with duration and assessment scores,
  (4) Experience fit — Gaussian centered on JD's ideal range,
  (5) Behavioral signals — weighted composite of response rate, activity
  recency, notice period, and platform engagement. Honeypot detection
  uses 6 heuristic checks for impossible profiles. Runtime ~2 minutes
  for 100K candidates on CPU. Pure Python stdlib, zero external deps.

